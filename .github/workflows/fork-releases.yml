name: Fork desktop releases

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Track to build
        type: choice
        options: [all, personal, stable, nightly]
        default: all
      signed:
        description: Sign and enable automatic updates (requires Apple signing secrets)
        type: boolean
        default: false
  push:
    branches: [personal, release/stable, release/nightly]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: write

jobs:
  tracks:
    runs-on: ubuntu-latest
    outputs:
      tracks: ${{ steps.select.outputs.tracks }}
    steps:
      - id: select
        env:
          REQUESTED: ${{ inputs.channel }}
          BRANCH: ${{ github.ref_name }}
        run: |
          case "${REQUESTED:-$BRANCH}" in
            all) echo 'tracks=["stable","nightly","personal"]' >> "$GITHUB_OUTPUT" ;;
            stable|release/stable) echo 'tracks=["stable"]' >> "$GITHUB_OUTPUT" ;;
            nightly|release/nightly) echo 'tracks=["nightly"]' >> "$GITHUB_OUTPUT" ;;
            personal) echo 'tracks=["personal"]' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

  release:
    needs: tracks
    strategy:
      fail-fast: false
      matrix:
        track: ${{ fromJSON(needs.tracks.outputs.tracks) }}
    concurrency:
      group: fork-release-${{ matrix.track }}
      cancel-in-progress: false
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # Full objects avoid fetching upstream-only merge blobs from the fork promisor remote.
      # Sparse checkout keeps vendored references out of the build workspace.
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.track == 'personal' && 'personal' || format('release/{0}', matrix.track) }}
          fetch-depth: 0
      - name: Exclude reference checkouts after the full clone
        run: git sparse-checkout set --no-cone '/*' '!/.repos/'
      - name: Fetch upstream history
        # The changelog calls commits reachable from here upstream's and everything else ours.
        run: git fetch --no-tags https://github.com/pingdotgg/t3code.git '+refs/heads/main:refs/upstream/main' '+refs/tags/*:refs/upstream/tags/*'
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          run-install: false
      - run: vp i --frozen-lockfile
      - name: Include the newest upstream nightly
        # Personal stays on the edge: every build carries upstream's newest nightly. A merge
        # that conflicts or fails typechecks is left out and said so in the changelog; the
        # daily upstream sync opens an issue for it.
        if: matrix.track == 'personal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          nightly=$(gh release list --repo pingdotgg/t3code --exclude-drafts --limit 40 --json tagName --jq '[.[] | select(.tagName | test("-nightly\\."))][0].tagName')
          test -n "$nightly" || exit 0
          if git merge-base --is-ancestor "refs/upstream/tags/$nightly" HEAD; then
            echo "personal already contains $nightly"
            exit 0
          fi
          before=$(git rev-parse HEAD)
          git config user.name "fork-sync[bot]"
          git config user.email "fork-sync@users.noreply.github.com"
          if ! git merge --no-edit -m "chore(fork): merge upstream $nightly into personal" "refs/upstream/tags/$nightly"; then
            git merge --abort
            echo "RELEASE_NOTE=Upstream $nightly is not in this build: merging it conflicts." >> "$GITHUB_ENV"
            exit 0
          fi
          if vp i && (cd apps/desktop && npx tsc --noEmit) && (cd apps/server && npx tsc --noEmit) && (cd apps/web && npx tsc --noEmit); then
            echo "MERGED_NIGHTLY=$nightly" >> "$GITHUB_ENV"
          else
            git reset -q --hard "$before"
            vp i --frozen-lockfile
            echo "RELEASE_NOTE=Upstream $nightly is not in this build: it fails typechecks when merged." >> "$GITHUB_ENV"
          fi
      - name: Check channel behavior
        run: vp test run packages/shared/src/desktopReleaseChannels.test.ts apps/desktop/src/updates/updateChannels.test.ts scripts/fork-release-notes.test.ts
      - name: Build
        env:
          TRACK: ${{ matrix.track }}
          SIGNED: ${{ (inputs.signed || vars.FORK_SIGNED_RELEASES == 'true') && 'true' || 'false' }}
          # Public T3 Connect identifiers, baked into the bundle. Without them Connect is disabled.
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
          T3CODE_RELAY_URL: ${{ vars.RELAY_URL }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          base=$(node -p "require('./apps/desktop/package.json').version.split('-')[0]")
          version="$base-fork.$TRACK.$(date -u +%Y%m%d%H%M%S)"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          args=(--platform mac --target zip --arch arm64 --build-version "$version" --output-dir release/fork)
          if [ "$SIGNED" = true ]; then
            test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_API_KEY" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER"
            args+=(--signed)
          fi
          node scripts/build-desktop-artifact.ts "${args[@]}"
          if [ "$SIGNED" != true ]; then
            archive=$(find release/fork -maxdepth 1 -name '*.zip' -print -quit)
            ditto -x -k "$archive" "$RUNNER_TEMP/fork-app"
            codesign --force --deep --sign - --preserve-metadata=entitlements,requirements,flags,runtime "$RUNNER_TEMP/fork-app/T3 Code.app"
            codesign --verify --deep --strict "$RUNNER_TEMP/fork-app/T3 Code.app"
            rm "$archive"
            ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/fork-app/T3 Code.app" "$archive"
            # Repacking invalidates blockmaps. Unsigned releases never expose updater manifests.
            find release/fork -maxdepth 1 \( -name '*.blockmap' -o -name '*-mac.yml' \) -delete
          fi
      - name: Publish this track
        env:
          GH_TOKEN: ${{ github.token }}
          TRACK: ${{ matrix.track }}
          SIGNED: ${{ (inputs.signed || vars.FORK_SIGNED_RELEASES == 'true') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          tag="desktop-$TRACK"
          if [ -n "${MERGED_NIGHTLY:-}" ]; then
            # Record the merge on the branch. Losing a race with a new push is fine: that push
            # builds again and merges again.
            git push origin HEAD:personal || echo "::warning::Could not push the $MERGED_NIGHTLY merge to personal"
          fi
          previous="$RUNNER_TEMP/previous-notes.md"
          gh release view "$tag" --json body --jq .body > "$previous" 2>/dev/null || : > "$previous"
          notes="$RUNNER_TEMP/release-notes.md"
          printf 'Version: `%s`\n\nSource: `%s`\n\n' "$RELEASE_VERSION" "$(git rev-parse HEAD)" > "$notes"
          if [ "$SIGNED" = true ]; then
            printf 'Signed release. Select this track in Settings → About → Update track.\n' >> "$notes"
          else
            printf 'Apple Silicon build. Installed T3 Code on this track updates itself from Settings → About; for a first install, unzip and drag T3 Code.app to Applications.\n' >> "$notes"
          fi
          printf '\nStable, Nightly, and Personal use separate data profiles. Personal preserves the existing ~/.t3-personal profile.\n\n' >> "$notes"
          # What changed, per build, shown when hovering the update in the app.
          node scripts/fork-release-notes.ts --version "$RELEASE_VERSION" --previous "$previous" \
            ${RELEASE_NOTE:+--note "$RELEASE_NOTE"} >> "$notes"
          prerelease=(--prerelease=false)
          [ "$TRACK" = stable ] || prerelease=(--prerelease)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "T3 Code — $TRACK" --notes-file "$notes"
          else
            gh release create "$tag" --target "$(git rev-parse HEAD)" --title "T3 Code — $TRACK" --notes-file "$notes" "${prerelease[@]}" --latest=false
          fi
          files=(release/fork/*.zip)
          if [ "$SIGNED" = true ]; then
            files+=(release/fork/*-mac.yml release/fork/*.blockmap)
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          # The in-app updater installs the newest archive it finds. The previous one stays so
          # a download that started from an earlier check still resolves; older ones go.
          keep=$(gh release view "$tag" --json assets --jq '[.assets[].name | select(endswith(".zip"))] | sort | reverse | .[0:2] | .[]')
          for asset in $(gh release view "$tag" --json assets --jq '.assets[].name | select(endswith(".zip"))'); do
            printf '%s\n' "$keep" | grep -qx "$asset" || gh release delete-asset "$tag" "$asset" --yes
          done
